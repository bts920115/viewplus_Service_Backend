spring.application.name=viewplusTest
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# Google은 공개 STUN만 제공한다. 실제 NAT/방화벽 우회를 위해서는 아래 TURN 환경 변수를 설정한다.
webrtc.stun-urls=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
# 테스트용 ExpressTURN 설정. 운영 환경에서는 환경 변수 또는 Secret Manager로 이동한다.
webrtc.turn.urls=${WEBRTC_TURN_URLS:}
webrtc.turn.username=${WEBRTC_TURN_USERNAME:}
webrtc.turn.credential=${WEBRTC_TURN_CREDENTIAL:}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/viewplus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

