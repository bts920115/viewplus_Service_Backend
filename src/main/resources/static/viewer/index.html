<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViewPlus · 함께 보는 즐거움</title>
<style>
:root{font-family:system-ui,sans-serif;color:#181c23;background:#f8f9fc;--blue:#3057d5}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--blue);color:white;font-weight:650}button:disabled{opacity:.5}input{width:100%;border:1px solid #dce1ea;border-radius:10px;padding:12px;background:#fff;color:#181c23}label{display:block;font-size:14px;margin:16px 0 8px}h1,h2,p{margin:0 0 16px}header{background:white;border-bottom:1px solid #e7eaf0;padding:18px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;gap:16px}header strong{font-size:23px;letter-spacing:-1px}header span{margin-left:auto;font-size:14px}main{max-width:1120px;margin:28px auto;padding:0 20px}.auth{max-width:420px;margin:60px auto;background:#fff;border:1px solid #e7eaf0;padding:32px;border-radius:20px}.muted{color:#657083;font-size:14px;line-height:1.6}.secondary{background:#edf1ff;color:var(--blue)}.wide{width:100%;margin-top:20px}.error{color:#b3261e;white-space:pre-wrap;margin:12px 0;min-height:20px}nav{display:flex;gap:8px;margin-bottom:24px}nav button{background:white;color:#657083}nav button.active{background:var(--blue);color:white}.heading{display:flex;align-items:center;justify-content:space-between;margin:20px 0}.heading h2{margin:0}.list{display:grid;gap:12px}.row{background:#fff;border:1px solid #e7eaf0;border-radius:14px;padding:20px;display:flex;align-items:center;gap:16px;text-align:left;color:inherit;width:100%;font-weight:400}.row .play{font-size:24px;color:var(--blue);background:#edf1ff;border-radius:12px;padding:16px}.row strong{display:block;margin-bottom:6px}.row small{color:#657083}.friend-form{display:flex;gap:8px;margin-bottom:20px}.player-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.stage{background:#050505;border-radius:16px;overflow:hidden;min-height:340px}video{width:100%;height:65vh;object-fit:contain}.chat{background:white;border:1px solid #e7eaf0;border-radius:16px;padding:18px;display:flex;flex-direction:column}.chat-log{flex:1;min-height:180px;max-height:50vh;overflow:auto;overflow-wrap:anywhere}.chat-log p{font-size:14px;line-height:1.6}.chat form{display:flex;gap:8px}.status{padding:12px 0;color:#657083}[hidden]{display:none!important}@media(max-width:760px){.player-grid{grid-template-columns:1fr}.auth{margin:24px auto;padding:24px}header{padding:16px}video{height:48vh}main{margin-top:20px}.chat-log{max-height:200px}}
.player-grid{align-items:start}.stage{--video-ratio:1.777777778;min-height:0;width:min(100%,calc(72vh * var(--video-ratio)));width:min(100%,calc(72dvh * var(--video-ratio)));aspect-ratio:var(--video-ratio);margin-inline:auto}.stage video{display:block;width:100%;height:100%;object-fit:contain}
</style></head><body>
<header><strong>ViewPlus</strong><span id="account"></span><button id="logout" class="secondary" hidden>로그아웃</button></header>
<main>
<section id="auth" class="auth"><h1 id="auth-title">로그인</h1><p class="muted">친구와 함께 보고, 이야기하세요.</p>
<form id="auth-form"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required maxlength="254">
<div id="nickname-field" hidden><label for="nickname">닉네임</label><input id="nickname" minlength="2" maxlength="30" autocomplete="nickname"></div>
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="72">
<p id="auth-error" class="error" role="alert"></p><button id="auth-submit" class="wide">로그인</button></form>
<button id="auth-toggle" class="secondary wide">회원가입</button></section>
<section id="app" hidden><nav><button id="live-tab" class="active">라이브 목록</button><button id="friend-tab">친구 목록</button></nav>
<p id="app-error" class="error" role="alert"></p>
<section id="browse"><div class="heading"><h2 id="list-title">지금 라이브</h2><button id="refresh" class="secondary">새로고침</button></div>
<form id="friend-form" class="friend-form" hidden><input id="friend-email" type="email" placeholder="친구 이메일" aria-label="친구 이메일" required><button>친구 요청</button></form>
<div id="list" class="list" aria-live="polite"></div></section>
<section id="watch" hidden><div class="heading"><h2 id="room-title"></h2><button id="leave" class="secondary">목록으로</button></div>
<div class="player-grid"><div><div class="stage"><video id="video" autoplay playsinline controls></video></div><p id="status" class="status" role="status"></p></div>
<aside class="chat"><h3>라이브 채팅</h3><div id="chat-log" class="chat-log" aria-live="polite"></div><form id="chat-form"><input id="chat-input" maxlength="800" placeholder="메시지 입력" aria-label="메시지" required><button>전송</button></form></aside></div></section>
</section></main>
<script src="/viewer/viewer.js" defer></script></body></html>
